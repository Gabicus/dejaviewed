<style>
/* ── Search page — page-local. Pagefind UI themed via its CSS vars to DESIGN.md tokens. ── */
.sp{max-width:920px;margin:0 auto;padding:28px 22px 80px;overflow-x:hidden}
.sp *{min-width:0}
.sp .eyebrow{font:700 11px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sp h1{margin:10px 0 6px;font:900 clamp(30px,4.5vw,44px)/1.05 'Inter',sans-serif;letter-spacing:-.03em;background:linear-gradient(135deg,#fff 0%,var(--accent) 50%,var(--accent-2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp .lede{margin:0 0 22px;color:var(--text-dim);font-size:14px;line-height:1.6;max-width:62ch}
.sp .lede code{font:500 12px 'JetBrains Mono',monospace;color:var(--accent);background:var(--panel-2);padding:1px 6px;border-radius:4px}
.sp .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#search{
  --pagefind-ui-scale:.9;
  --pagefind-ui-primary:#a78bfa;
  --pagefind-ui-text:#e8e8f0;
  --pagefind-ui-background:rgba(10,10,15,.6);
  --pagefind-ui-border:rgba(255,255,255,.15);
  --pagefind-ui-tag:rgba(167,139,250,.15);
  --pagefind-ui-border-width:1px;
  --pagefind-ui-border-radius:8px;
  --pagefind-ui-image-border-radius:6px;
  --pagefind-ui-font:'JetBrains Mono',Menlo,monospace;
}
#search .pagefind-ui__search-input{color:var(--text);font-weight:500}
#search .pagefind-ui__search-input::placeholder{color:var(--text-mute);opacity:1}
#search .pagefind-ui__form::before{background-color:var(--accent)}
#search .pagefind-ui__search-clear{background:transparent;color:var(--text-dim)}
#search .pagefind-ui__message{color:var(--text-mute);font-size:12px;letter-spacing:.04em}
#search .pagefind-ui__result{border-top:1px solid var(--border)}
#search .pagefind-ui__result-link{color:#fff;font-family:'Inter',sans-serif;font-weight:800}
#search .pagefind-ui__result-link:hover{color:var(--accent)}
#search .pagefind-ui__result-excerpt{color:var(--text-dim);font-family:'Inter',sans-serif;font-size:14px;line-height:1.55}
#search .pagefind-ui__result-nested .pagefind-ui__result-link{font-weight:600;color:var(--text)}
#search mark{background:rgba(167,139,250,.28);color:#fff;border-radius:2px;padding:0 1px}
#search .pagefind-ui__filter-name,#search .pagefind-ui__filter-label{color:var(--text-dim)}
#search .pagefind-ui__filter-checkbox{background:var(--panel-2);border-color:var(--border-hi)}
#search .pagefind-ui__filter-checkbox:checked{background:var(--accent)}
#search .pagefind-ui__button{background:var(--panel-2);color:var(--text);border-color:var(--border-hi);font-family:'Inter',sans-serif;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
#search .pagefind-ui__button:hover{border-color:var(--accent);color:#fff}
@media(max-width:640px){.sp{padding:20px 16px 48px}.sp .panel{padding:12px}}
</style></head><body>
<script>DV.mountHeader(document.body, 'search');</script>
<main class="sp">
  <span class="eyebrow">▪ Search</span>
  <h1>Find that thing you saved</h1>
  <p class="lede">Every entry, transcript excerpt, guide and deep dive — indexed at build time, searched in your browser. Filter by <code>kind</code> to narrow to guides or deep dives.</p>
  <div class="panel"><div id="search" role="search"></div></div>
</main>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var q = params.get('q') || '';
  if (typeof PagefindUI === 'undefined') {
    var msg = DV.el('p', { class:'lede' }, 'Search index not found — run scripts/build_search.sh.');
    document.getElementById('search').appendChild(msg);
    return;
  }
  var ui = new PagefindUI({
    element: '#search',
    showSubResults: true,
    showImages: false,
    excerptLength: 28,
    resetStyles: true,
    autofocus: !q,
    translations: { placeholder: 'search saves, transcripts, guides…' }
  });
  if (q) ui.triggerSearch(q);
  // Keep ?q= in the URL so a search can be shared or reloaded.
  var t;
  document.addEventListener('input', function(e){
    if (!e.target.classList || !e.target.classList.contains('pagefind-ui__search-input')) return;
    clearTimeout(t);
    t = setTimeout(function(){
      var v = e.target.value.trim();
      var u = new URL(location.href);
      if (v) u.searchParams.set('q', v); else u.searchParams.delete('q');
      history.replaceState(null, '', u);
    }, 300);
  });
})();
</script>
