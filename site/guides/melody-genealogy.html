<script id="md" type="text/markdown"># Melody Genealogy — Crate-Digging the Public Domain with Local Search

**Insight class:** Emergent Capability · **Difficulty:** Hard · **Quality:** 4/5
**Connected entries:** 12 · **Tools:** Banjo, Unreal Engine

---

## Thesis

Chance McCoy traces Shady Grove back to Child Ballad #81 and Sally in the Garden to a 1929 Brunswick 78 — by ear, one tune at a time. Sample diggers do the same hunt for producer gold, also by hand. Local multimodal search like SentrySearch already finds moments in hours of video from a plain-language query. Point that pattern at Lomax, Prelinger and 78-rpm archives with audio embeddings, and you get a tune family tree plus cleared public-domain samples, each with provenance.

---

## Why it matters

Folk players, music teachers and producers get a searchable map of how melodies travelled across centuries, languages and continents. Producers get a legally clean sample source with a story attached — the opposite of crate-digging your way into a clearance fight.

### 'Shady Grove' — Doc Watson's clawhammer D-Dorian and a 400-year melody
**Creator:** [@chancemccoymusic](https://instagram.com/chancemccoymusic) · **Tier:** S
**Tools:** Banjo

> Ground truth — one tune traced through Doc Watson, Jean Ritchie and Child Ballad #81

Chance McCoy plays Doc Watson's clawhammer banjo 'Shady Grove' in modal D-Dorian (pull-offs, drop-thumb at speed) and traces the minor melody to Jean Ritchie's father in Viper, Kentucky, and back to Child Ballad #81, 'Matty Groves'. A deep lineage lesson in one tune.

## Action sketch — how to implement this

- Pull 200–500 public-domain recordings (Library of Congress and Internet Archive 78s), transcribe pitch contours with a melody extractor, and embed both contours and audio with an open audio model into ChromaDB, following SentrySearch's local layout
- Test on known families: do Shady Grove / Matty Groves and the Hog-Eye Man tunes land near each other? Have Claude write a lineage-graph view (NetworkX plus a force graph) with timestamped links back to sources
- Package one cluster as a public-domain sample pack with a provenance sheet and a short video tracing its family; release free and measure producer pickup
- Falsifier: if known variant families don't cluster above chance in embedding space, the search is noise and the hand method stays the only method

---

## Prerequisites

- Careful public-domain verification per recording (recording rights differ from composition rights)
- Python audio tooling
- Patience with archive metadata
