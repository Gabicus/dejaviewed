<script id="md" type="text/markdown"># Strategy Autoresearch — the judge is the product, not the agent

**Insight class:** Workflow Multiplier · **Difficulty:** Medium · **Quality:** 5/5
**Connected entries:** 11 · **Tools:** Claude, Claudex, Codex, OpenAI, Python, SkillOpt

---

## Thesis

Self-rewriting loops (Karpathy-style autoresearch, bilevel coach loops, Microsoft SkillOpt) keep any edit that beats a benchmark. Point one at trading and it becomes an industrial overfitting machine — the backtest is the benchmark, and the loop will beat it ten thousand times. The quant saves already hold the fix: probability of backtest overfitting, permutation tests, transaction costs and backtest-to-live drift. Wire those in as the loop's judge, and use the loop's own log as the exact count of trials — the number human quants never know.

---

## Why it matters

A solo builder can run more strategy variants in a weekend than a small fund tests in a quarter. The difference between that being an edge and a casino is whether the gate deflates for every attempt. Most likely you learn you have no edge, cheaply, and that's worth money too.

## Action sketch — how to implement this

- Wrap a vectorized backtester (VectorBT) in a SkillOpt-style loop where Claude proposes strategy edits and every proposal is appended to a trials table with its parameters and result.
- Replace 'beats benchmark' with a judge that needs all four: positive after realistic fees, beats 95% of a permutation null, deflated Sharpe positive using the trials-table count, and a held-out year scored once at the end.
- Have a second model (Codex or GPT) audit each surviving strategy's code for look-ahead bias before it reaches paper trading; monitor live drift with Wasserstein distance and auto-retire on breach.
- falsifier: seed the loop with pure-noise synthetic prices. If anything passes the judge, the judge is broken — fix it before you show it a real market.

---

## Prerequisites

- Python and VectorBT or similar backtester
- Clean historical data with realistic cost assumptions
- Paper-trading account
- Discipline to treat 'no survivors' as a valid result
