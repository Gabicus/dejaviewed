**Insight class:** Creative Fusion · **Difficulty:** Medium · **Quality:** 4/5

---

## Thesis

Roots musicians already treat the room as an instrument — testing a 200-year-old house's resonance, filming tunes on porches and in old venues, the way Lomax filmed singers in their own kitchens. A phone can now capture that room as a Gaussian splat, and Gausseous makes the splat react to audio in a browser. Record the room's acoustics in the same session and the sound and the image come from one capture of one place.

---

## Why it matters

A two-person act with a phone gets a music video format where the place itself moves with the tune — no crew, no generated faces, and the result is documentary, not synthetic. It also gives folk and field-recording traditions a native visual form instead of borrowing pop-video tropes.

## Action sketch — how to implement this

- Scan one meaningful room (a porch, a church, a barn) with a phone splat app (Polycam or Luma), then load the .ply into Gausseous and drive it with a rough recording of one tune
- In the same session, record a clap or sine-sweep impulse response of the room and convolve your dry instrument recording with it, so the audio carries that room's acoustics
- Cut a 60-second vertical piece — real performance footage intercut with the reacting splat — and A/B it against a plain performance video on the same account
- Falsifier: if low-light interior scans come out too noisy to read, or the splat cut loses watch-through to the plain performance video, the format is a gimmick

---

## Prerequisites

- Phone with a splat-capture app
- A room with a story and permission to scan it
- DAW with a convolution reverb
