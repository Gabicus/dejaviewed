<script id="md" type="text/markdown"># Buying Dead Apps — the one-person AI-native rollup

**Insight class:** Arbitrage Opportunity · **Difficulty:** Hard · **Quality:** 4/5
**Connected entries:** 11 · **Tools:** Anthropic, ChatGPT, Claude, Claude Code, Codex, DeepWiki, GitDiagram, GitMCP, Gitingest, PostHog, Reverse Engineer Anything, VS Code, cron

---

## Thesis

Bending Spoons went from $40k to an $18B IPO by buying stagnant software, rebuilding only what customers use, and compounding the margin. Public SaaS multiples just got cut in half. Meanwhile the catalog holds the full toolchain for agent-driven rebuilds — repo comprehension, reverse engineering, orchestrator/executor loops with earned autonomy, and checklists for the legal and performance gaps vibe-coded apps leave. Scale the playbook down: small cash-flowing apps sell for a few times annual profit, and the rebuild cost is the variable AI just crushed.

---

## Why it matters

Building new means a cold start on distribution. Buying old means you inherit customers and search rank, and the agent stack turns the costly part — understanding and modernizing someone else's code — into days instead of months.

### Bending Spoons playbook — AI-native acquisitions of stagnant SaaS
**Creator:** [@tom__shipley](https://instagram.com/tom__shipley) · **Tier:** B

> The playbook — buy stagnant, rebuild the used core lean, margin is the strategy

Bending Spoons grew from $40k to an $18B IPO by buying stagnating platforms (Evernote, Vimeo, Meetup, WeTransfer) cheaply, rebuilding only the core features customers use with a lean elite engineering team, cutting cost base and compounding margin into the next deal. Argues AI-native acquirers, not vendors, are the new playbook PE/VC is funding.

### Fable orchestrates, Opus executes — cutting frontier-model token spend
**Creator:** [@thomas.lentine](https://instagram.com/thomas.lentine) · **Tier:** A
**Tools:** Claude Code

> Fable plans, Opus executes — top-model judgment on the rebuild without burning budget

Brain-dump your task list to Fable, have it write specs and spawn cheaper Opus subagents (in parallel worktrees) to execute, then Fable reviews and sends fixes back in a loop until it's good enough. You get top-model judgment without burning usage limits on implementation.

[View original post](https://www.instagram.com/p/Da1hOm7scjR/)
### Agentic OS on Claude Fable 5 — cron loop with earned autonomy
**Creator:** [@raycfu](https://instagram.com/raycfu) · **Tier:** A
**Tools:** Claude Code, cron

> Cron loop with earned autonomy and daily regression tests — keeps an acquired app alive unattended

Blueprint: a cron-run loop.sh where a cheap model triages changes, Fable 5 plans as manager, Sonnet executes and a fresh Fable reviews. Tasks earn autonomy after 20 passes at 95% and lose it below 90%, refusals come back as HTTP 200 so scripts must check stop_reason, and a goals directory reruns regression tests daily.

[View original post](https://www.instagram.com/p/DamEcWuPvX0/)
### Vibe-coded app legal risks — ten compliance gaps that get you sued
**Creator:** [@murphmaxxing](https://instagram.com/murphmaxxing) · **Tier:** B
**Tools:** ChatGPT, Claude

> Ten compliance gaps that get indie apps sued — the legal diligence checklist

Ten liability traps for indie apps with rough per-user fines: missing or incomplete privacy policy (data collection, AI use, third parties), undeleted uploads, public storage buckets, fake testimonials, hard-to-cancel subscriptions, silent trial auto-charges, and chatbots without self-harm handling.

### Vibe-coded app performance — five fixes Claude usually skips
**Creator:** [@haydenschmitty](https://instagram.com/haydenschmitty) · **Tier:** A
**Tools:** Claude, Claude Code

> Five performance gaps in AI-written code — the post-rebuild hardening checklist

Five backend/frontend performance gaps in AI-written apps: uncompressed JSON responses, row-by-row database inserts, a single dependency bottleneck in round-trip latency, no optimistic UI updates, and server re-rendering HTML for every visitor instead of caching.

## Action sketch — how to implement this

- Scrape listings on micro-acquisition marketplaces (Acquire.com, Flippa) under $50k and have Claude score each on revenue stability, stack age, and how much of the code you could replace.
- For the top three, request repo access under NDA, run gitingest plus deepwiki, and have an orchestrator agent produce a rebuild spec, a cost estimate in hours and the compliance gap list.
- Buy one, ship PostHog first, then rebuild only the top-used flows with an orchestrator/executor loop and daily regression tests, and track churn monthly.
- falsifier: if the rebuild plus migration costs more than six months of the app's profit, or churn after migration goes above 10%, the AI discount isn't real at this size.
