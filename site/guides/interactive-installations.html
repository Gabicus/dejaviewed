**Insight class:** Expression Amplifier · **Difficulty:** Medium · **Quality:** 4/5

---

## Thesis

Kinect/MediaPipe body tracking + TouchDesigner + Unreal Engine = interactive art installations that respond to human movement. Previously needed a studio budget; now runs on a gaming laptop.

---

## Why it matters

Interactive art installations used to require a $50K+ budget: custom hardware, specialized software, a team of creative technologists. Now MediaPipe runs body tracking on a $30 webcam, TouchDesigner handles the visual pipeline, and a $200 projector fills a wall. The total cost dropped 99%. This democratization means independent artists can build gallery-quality interactive work in their apartment. The posts here map the complete stack from body input to visual output, including real examples of installations that respond to movement, sound, and light.

## Action sketch — how to implement this

MediaPipe for body tracking (free, runs on webcam) → pipe data to TouchDesigner → drive visuals in Unreal or project with a $200 projector. Gallery-quality interactive art for under $500 in hardware.

---

## Prerequisites

Webcam, TouchDesigner (free for non-commercial), projector ($200+), laptop with decent GPU
