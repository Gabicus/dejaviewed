<script id="md" type="text/markdown"># Forecast the Weather, Not the Price — gating models by tradeability

**Insight class:** Emergent Capability · **Difficulty:** Medium · **Quality:** 4/5
**Connected entries:** 9 · **Tools:** Claude, Hugging Face, Kronos, Python

---

## Thesis

Open candlestick foundation models like Kronos give you a forecast on every bar, and a hedge-fund stress test says it fails on many levels. A separate save shows the better question: a small logistic regression that predicts tomorrow's efficiency ratio (trend versus chop) and skips the choppy days lifted almost every metric over two years out of sample. Physics-flavored measures in the quant collection — Lempel-Ziv compressibility, Hurst exponent, Lyapunov exponent, hidden Markov regimes — are all measures of the same thing: is this market forecastable right now? Use them as a confidence gate on the foundation model, not as signals.

---

## Why it matters

You stop asking a model to be right everywhere and only ask it to be right where structure exists. That turns a free open model plus a few cheap statistics into something you can actually size positions with.

## The evidence — connected entries

### Efficiency-ratio forecaster — skip choppy days to lift a strategy's metrics
**Creator:** [@telonicstrading](https://instagram.com/telonicstrading) · **Tier:** A

> Proof of concept — forecasting regime instead of direction, used as a trade filter, held out of sample

Instead of predicting direction, a logistic regression on 15 price features forecasts the next day's Kaufman efficiency ratio (trendiness versus chop). Trades on predicted low-efficiency days made about a third of the money, so gating them out improved nearly every metric and held on two years of out-of-sample data.

> Lempel-Ziv complexity — low compressibility means noise, high means repeating structure

Applies the LZ compression algorithm (behind .zip files) to financial time series. When LZ complexity is low, patterns repeat and the market is more predictable. When high, it's random noise. Novel cross-domain application.

**Creator:** [@quant.dhawan](https://instagram.com/quant.dhawan) · **Tier:** A

> Hurst exponent surface — memory varies by timeframe, so the gate must be timeframe-aware

Plots the Hurst Exponent of BTC-USD as a 3D surface. H>0.5 = trending (momentum), H<0.5 = mean-reverting, H=0.5 = random walk. Shows how market 'memory' varies across timeframes. Basis for adaptive strategy selection.

## Action sketch — how to implement this

- Run Kronos zero-shot on two years of hourly BTC and QQQ and log every forecast with its realized error.
- Compute rolling efficiency ratio, Lempel-Ziv complexity and Hurst for each bar, bucket bars into tradeability quintiles, and plot Kronos error per quintile.
- If error falls across quintiles, fit the efficiency-ratio-style logistic model to predict next-period tradeability and paper-trade Kronos only in the top bucket.
- falsifier: if Kronos error is flat across tradeability quintiles, the complexity measures say nothing about this model's skill and the gate is decoration.
