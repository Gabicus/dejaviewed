**Insight class:** Creative Fusion · **Difficulty:** Medium · **Quality:** 5/5
**Connected entries:** 14 · **Tools:** After Effects, Artist Grant, Blender, Claude, DuckStation, FFmpeg, Fine Art America, Gelato, Mandelbulber, Orbiter, Printful, Python, Raspberry Pi, ln, vpype

---

## Thesis

Fogleman's ln turns any 3D scene into hidden-line vector paths, and vpype makes those paths plotter-ready. Everything else in the catalog that produces geometry — a phone scan, a ripped PS1 level, a ray-marched fractal, a strange attractor, the phase-space shape of BTC volatility, a Blender scene an agent wrote in Python — becomes a source for that one pipe. The output is a physical ink original, and in a market drowning in free pixels that is the scarce thing.

---

## Why it matters

You get a repeatable way to make signed physical editions from subjects nobody else is drawing, with the agent doing the scene work and the plotter doing the craft. Print-on-demand and no-proposal grants already give you a path to sell and fund it.

### ln + vpype — 3D scenes to hidden-line vector art for pen plotters
**Creator:** [@index.opensource](https://instagram.com/index.opensource) · **Tier:** S
**Tools:** ln, vpype

> The bridge — ln does hidden-line removal on 3D scenes, vpype sorts paths and cuts pen-up travel

Michael Fogleman's ln (Go) renders 3D scenes as 2D vector paths by ray-testing each path segment for visibility, supporting CSG, math surfaces and procedural cities. vpype then merges and sorts paths for plotting, cutting pen-up travel 86% in this example. Both MIT licensed, output straight to SVG.

## Action sketch — how to implement this

- Week 1: install ln (Go) and vpype; have Claude Code write a script that loads an OBJ (start with a DuckStation PS1 rip or a phone scan) into ln, sets camera and texture paths, and exports SVG; run vpype linemerge/linesort and preview
- Week 2: add two math sources — a Thomas attractor and a 3-lag phase-space embedding of a year of BTC daily volatility — emitted as 3D polylines straight into ln; make a 6-print series titled by date range
- Week 3: plot the series on an A3 pen plotter (AxiDraw-class or a DIY drawing machine) with two pen weights, photograph per the print-on-demand guide, list originals plus POD reproductions, and submit to one grant
- Falsifier: if scanned or ripped meshes produce unreadable line mush unless you hand-pick every path, or if plotted originals cannot sell above the POD print price, the loop is a toy, not a practice
