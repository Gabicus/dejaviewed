**Insight class:** Emergent Capability · **Difficulty:** Medium · **Quality:** 5/5
**Connected entries:** 11 · **Tools:** Agent Reach, Anthropic, ChatGPT, Claude, Claude Code, GPT-5, GitHub Actions, Grok Imagine, Hermes Skills Hub, Kimi, Llama, Muse Code, OpenAI, Pocket TTS, Vercel, elder-plinius/L1B3RT4S, kimi-k3-in-c

---

## Thesis

The catalog holds both halves of a loop nobody has closed. On one side sit offense corpora and autonomous attackers — L1B3RT4S still landing on GPT-5, an agent that goes from one sentence to a verified exploit, scanners hunting exposed AI servers. On the other sit the pipes that pour untrusted text into your agent — Agent Reach reading Reddit and X, 90k-skill hubs, one-command skill installers. Point the attacker inward and you get prompt-injection CI — every skill install and harness change gets replayed against a jailbreak-and-hijack suite before it touches your keys.

---

## Why it matters

Solo builders now run agents with real API keys, inboxes and broker access, and Noma's research shows most automations hand data to anyone who simply asks. Whoever ships a cheap, repeatable injection test owns the trust layer for every one-person agent shop — and sleeps through their own cron jobs.

## Action sketch — how to implement this

- Build a 50-case suite this week — 20 L1B3RT4S-style jailbreaks, 20 Noma-style 'just ask for the data' hijacks planted in fake Reddit/X posts fetched via Agent Reach, 10 sponsored-option nudges — and run it against your harness with a canary secret in the environment
- Wire it as a pre-install hook: any new skill from find-skills or a skills hub gets diffed, then the suite reruns with that skill loaded; fail the install if the canary leaks or a tool call goes outside the allowlist
- Add the sandboxing layer from the portfolio-projects post — per-skill capability manifests (network, filesystem, secrets) — and measure how many suite cases each manifest blocks
- Falsifier: if a plain allowlist on outbound tool calls blocks ≥95% of the suite with no skill-level testing, the CI layer is overkill and a static policy file is the whole answer

---

## Prerequisites

- An agent harness with hooks (Claude Code or similar)
- A throwaway canary secret and a disposable test account
- Test only harnesses, accounts and keys you own
