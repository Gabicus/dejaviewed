**Insight class:** Arbitrage Opportunity · **Difficulty:** Medium · **Quality:** 4/5
**Connected entries:** 12 · **Tools:** Apple Shortcuts, Claude, Flash MoE, God's Eye View, Kalshi, LiquidTrade, NASA EONET, Next.js, Polymarket, Python, QuiverQuant, Raspberry Pi, RuView, TypeScript

---

## Thesis

A student cleared $100K+ on Polymarket weather contracts with a dorm-built weather station, and a separate trader harvests contracts already sitting at 99c. Put those next to free real-time feeds (NASA EONET, SDR-received weather satellite images, public EIA/HIFLD infrastructure data, live plane and ship layers) and the pattern is clear — the edge on event contracts is not a smarter model, it is a faster or closer read of the exact source the contract settles on. Cheap sensors plus an agent that watches the order book in the final hours turn that into a repeatable process. A student cleared $100K+ on Polymarket weather contracts with a dorm-built weather station.

---

## Why it matters

One person with a Raspberry Pi, a cheap sensor and an agent can compete on data latency in markets where the crowd is reading the same delayed public report. The 99c harvest and the sensor edge live in the same window — the last hours before resolution — so one rig serves both.

## Action sketch — how to implement this

- Pull every open weather and event contract on Kalshi and Polymarket, and have Claude extract the settlement source and timing rule from each contract's rules into one table — which station, which report, what time.
- Pick the three contracts whose settlement station you can get physically near or read faster than its official report; log a Raspberry Pi sensor plus the public 5-minute station feed side by side for two weeks.
- Paper-trade only the final six hours before resolution, with a scheduled agent comparing your live reading to the market's implied probability and to the 99c harvest opportunities in the same window.
- falsifier: if the official station's public intra-hour feed already moves the price as fast as your sensor does, your sensor adds nothing — the edge was always the dorm student's local microclimate, not a method.

- Check that the venue is legal in your jurisdiction (Kalshi is US-regulated; Polymarket access varies)
- Raspberry Pi and a basic weather sensor
- Python for the order-book watcher
- Never trade on non-public information about people — sensor data only
