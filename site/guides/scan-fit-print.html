<script id="md" type="text/markdown"># Scan, Fit, Print — agents that design parts around real objects

**Insight class:** Emergent Capability · **Difficulty:** Medium · **Quality:** 4/5
**Connected entries:** 9 · **Tools:** After Effects, Blender, Claude, FFmpeg, Hugging Face, Moonshine, Orbiter, Python, Raspberry Pi, Raspberry Pi 5

---

## Thesis

Open-source scanners (a smartphone Orbiter rig, a Raspberry Pi handheld LiDAR, LingBot-Map's video-to-3D) now produce a usable mesh of the thing you need to fit. LLMs already write Blender Python, and they can build a CLI for any app that has no MCP. Point the agent at the scan, have it write parametric CAD that references the scanned surfaces, and you get a custom-fit part on the first print. That is the step generative 3D can't do yet.

---

## Why it matters

Makers, repair people and small product designers spend most of their CAD time measuring and re-printing. Tolerance-aware agent CAD collapses the loop from 'calipers, sketch, print, fail, repeat' into 'scan, describe, print'. Y-Pan and Gemma Translator show that whole working devices ship as STL plus a bill of materials.

## Action sketch — how to implement this

- Scan three awkward real objects (a tool handle, a bike mount point, a phone in its case) with the Orbiter workflow or photogrammetry; export clean meshes.
- Have Claude Code write a CadQuery/FreeCAD script that imports the mesh, fits planes/cylinders to the contact surfaces, and builds a mount with a stated clearance (e.g. 0.3 mm); prompt it to build its own CLI for the slicer.
- Print, test fit, feed caliper measurements back as corrections; log iterations-to-fit for agent vs your hand CAD.
- Falsifier: if agent CAD needs more print iterations than your own hand CAD on 3 of 3 objects, the scan-to-parametric step isn't ready — the fitting step, not the scanner, is the bottleneck.
