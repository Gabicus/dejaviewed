<script id="md" type="text/markdown"># Natural Language → 3D Scenes: The Pipeline That Didn't Exist 6 Months Ago

**Insight class:** Emergent Capability · **Difficulty:** Medium · **Quality:** 5/5
**Connected entries:** 4 · **Tools:** Blender, Claude, Claude Code, Higgsfield, Hunyuan3D, Hunyuan3D-2, MCP, MediaPipe, Playwright, Tencent, TouchDesigner, Tripo, Unity, Unreal Engine

---

## Thesis

MCP + Blender + Tripo + Claude Code together create a natural language 3D scene builder — describe what you want, get a full 3D scene. This was impossible before MCP existed.

---

## Why it matters

Six months ago, creating a 3D scene meant hours in Blender learning hotkeys, topology, and lighting. Now you type 'a cozy cabin in snow with warm interior lighting' and MCP bridges Claude Code to Blender, Tripo generates the meshes, and Hunyuan3D handles the geometry. The Model Context Protocol is the glue — it lets Claude manipulate Blender like a human operator, but faster. This isn't just automation; it's a new creative medium where language IS the modeling tool. The barrier to 3D went from years of training to a well-written sentence.

---

## Action sketch — how to implement this

Set up Blender MCP server → connect to Claude Code → use Tripo/Hunyuan3D for mesh gen → describe scenes in plain English → get rigged, lit 3D environments. Add TouchDesigner for live interaction.

---

Blender (free), Claude Code subscription, Tripo API key (free tier available), MCP server setup (~15 min)
