<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- DejaViewed carousel slide, 1080x1350. Filled by scripts/content_kit.py via str.replace on {{TOKENS}}. -->
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--text:#e8e8f0;--dim:#a0a0b8;--mute:#6a6a80;--violet:#a78bfa;--pink:#f472b6;--border:rgba(255,255,255,.10);
  --W:1080px;--H:1350px;--padX:92px;--padTop:76px;--padBot:64px;--body:46px;--h2:74px;--h1:92px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);width:var(--W);height:var(--H);overflow:hidden}
body{font-family:'Inter','Inter Display',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.slide{position:relative;width:var(--W);height:var(--H);padding:var(--padTop) var(--padX) var(--padBot);display:flex;flex-direction:column;
  background:radial-gradient(900px 700px at 105% -10%,rgba(167,139,250,.20),transparent 60%),
             radial-gradient(800px 600px at -15% 110%,rgba(244,114,182,.13),transparent 60%),var(--bg)}
.slide::before{content:"";position:absolute;left:0;top:0;right:0;height:8px;background:linear-gradient(90deg,var(--violet),var(--pink))}
.top{display:flex;align-items:center;justify-content:space-between;flex:none}
.brand{font:800 34px/1 'Inter Display','Inter',sans-serif;letter-spacing:-.02em;background:linear-gradient(135deg,#fff 0%,var(--violet) 55%,var(--pink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{font:700 28px/1 'JetBrains Mono','Liberation Mono',monospace;color:var(--violet);border:2px solid rgba(167,139,250,.55);border-radius:999px;padding:12px 22px;background:rgba(167,139,250,.08)}
.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:34px;padding:60px 0 48px}
.kicker{font:700 30px/1.2 'JetBrains Mono','Liberation Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--pink)}
h1{font:900 var(--h1)/1.04 'Inter Display','Inter',sans-serif;letter-spacing:-.03em;color:#fff;overflow-wrap:break-word}
h1 .grad{background:linear-gradient(135deg,#fff 0%,var(--violet) 60%,var(--pink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:800 var(--h2)/1.08 'Inter Display','Inter',sans-serif;letter-spacing:-.025em;color:#fff;overflow-wrap:break-word}
p,li{font-size:var(--body);line-height:1.32;overflow-wrap:break-word}
p{color:var(--text)}
.promise{color:var(--dim)}
.lbl{display:inline-block;font:700 30px/1 'JetBrains Mono','Liberation Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--violet);margin-right:14px;vertical-align:.18em}
.credit{font:600 44px/1.3 'Inter',sans-serif;color:var(--violet);overflow-wrap:anywhere}
ul{list-style:none;display:flex;flex-direction:column;gap:26px}
ul li{position:relative;padding-left:46px;color:var(--text)}
ul li::before{content:"";position:absolute;left:0;top:.5em;width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--violet),var(--pink))}
ol{list-style:none;display:flex;flex-direction:column;gap:30px}
ol li{display:grid;grid-template-columns:72px 1fr;column-gap:26px;align-items:start}
ol .n{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font:800 38px/1 'Inter',sans-serif;color:#0a0a0f;background:linear-gradient(135deg,var(--violet),var(--pink))}
ol b{display:block;font-weight:800;color:#fff}
ol span{display:block;color:var(--dim)}
blockquote{border-left:10px solid;border-image:linear-gradient(180deg,var(--violet),var(--pink)) 1;padding:6px 0 6px 40px;font:700 70px/1.18 'Inter Display','Inter',sans-serif;color:#fff;letter-spacing:-.015em;overflow-wrap:break-word}
.who{font:700 44px/1.2 'Inter',sans-serif;color:var(--violet)}
.url{font:700 46px/1.25 'JetBrains Mono','Liberation Mono',monospace;color:#fff;background:rgba(167,139,250,.10);border:2px solid rgba(167,139,250,.45);border-radius:22px;padding:26px 30px;overflow-wrap:anywhere}
.bio{color:var(--pink);font-weight:700}
.foot{flex:none;border-top:2px solid var(--border);padding-top:26px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.foot .link{font:600 28px/1.2 'JetBrains Mono','Liberation Mono',monospace;color:var(--dim);overflow-wrap:anywhere}
.foot .dot{flex:none;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink))}
{{EXTRA_CSS}}
</style></head>
<body><div class="slide type-{{TYPE}}">
  <div class="top"><div class="brand">DejaViewed</div><div class="pill">{{PILL}}</div></div>
  <div class="main">
    {{BODY}}
  </div>
  <div class="foot"><div class="link">{{FOOTER}}</div><div class="dot"></div></div>
</div></body></html>
