<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- DejaViewed reel frame, 1080x1920 (9:16). Same slide bodies as carousel.html; content_kit.py inlines
     carousel.html's <style> via {{BASE_CSS}} and overrides the canvas. Top 220px and bottom 340px are kept
     clear of text because Instagram's reel UI covers them. -->
<style>
{{BASE_CSS}}
:root{--W:1080px;--H:1920px;--padTop:220px;--padBot:340px;--body:50px;--h2:80px;--h1:100px}
.slide{background:radial-gradient(1100px 900px at 110% -5%,rgba(167,139,250,.22),transparent 60%),
             radial-gradient(1000px 800px at -20% 105%,rgba(244,114,182,.15),transparent 60%),var(--bg)}
.main{gap:44px}
</style></head>
<body><div class="slide type-{{TYPE}}">
  <div class="top"><div class="brand">DejaViewed</div><div class="pill">{{PILL}}</div></div>
  <div class="main">
    {{BODY}}
  </div>
  <div class="foot"><div class="link">{{FOOTER}}</div><div class="dot"></div></div>
</div></body></html>
